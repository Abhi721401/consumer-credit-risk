# docker-compose.yml — Consumer Credit Risk Analytics
#
# Brings up both services together:
#   - api:       FastAPI PD scoring service on :8000 (docs at /docs)
#   - dashboard: Streamlit analytics dashboard on :8501
#
# Usage:
#   cp .env.example .env        # fill in GROQ_API_KEY for the AI Copilot (optional)
#   docker compose up --build
#
# Then open:
#   http://localhost:8000/docs   (API)
#   http://localhost:8501        (Dashboard)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: credit-risk-api:latest
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: credit-risk-dashboard:latest
    container_name: credit-risk-dashboard
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    restart: unless-stopped
    depends_on:
      - api
